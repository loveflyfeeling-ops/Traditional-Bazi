<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="正統八字論命：四柱排盤、五行喜忌、大運流年、八字合婚與命書產製">
<title>正統八字論命</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左側「問測者」案卷欄 + 右側分頁工作區；命盤以宣紙格、墨色干支、五行色標示 */
:root{
  --paper:#f2f4f2; --sheet:#ffffff; --ink:#1b2225; --muted:#5d6a6c; --line:#d5dcda; --soft:#e7ecea;
  --accent:#1f5161; --accent-ink:#ffffff; --seal:#a8322a;
  --wood:#2f7a48; --fire:#c2372b; --earth:#9a6a1c; --metal:#6b7378; --water:#1f4f8f;
  --good:#2f7a48; --warn:#b07a12; --bad:#b2352b;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121718; --sheet:#1a2123; --ink:#e6ecea; --muted:#9aa8a9; --line:#2e393b; --soft:#232c2e;
  --accent:#7fb9c9; --accent-ink:#0e1a1e; --seal:#e0776c;
  --wood:#6cc28a; --fire:#f07a6c; --earth:#d9a650; --metal:#b4bcc0; --water:#7aa8ea;
  --good:#6cc28a; --warn:#e2b04a; --bad:#f07a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121718; --sheet:#1a2123; --ink:#e6ecea; --muted:#9aa8a9; --line:#2e393b; --soft:#232c2e;
  --accent:#7fb9c9; --accent-ink:#0e1a1e; --seal:#e0776c;
  --wood:#6cc28a; --fire:#f07a6c; --earth:#d9a650; --metal:#b4bcc0; --water:#7aa8ea;
  --good:#6cc28a; --warn:#e2b04a; --bad:#f07a6c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top h1{font-size:28px;font-weight:900;letter-spacing:.08em}
.top h1 span{color:var(--seal)}
.top .sub{color:var(--muted);font-size:13px}
.top .who{margin-left:auto;font-size:14px;color:var(--muted)}
.top .who b{color:var(--ink);font-family:var(--display);font-size:17px}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;max-width:1320px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.lbl{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.form .full{grid-column:1/-1}
.form .fl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.form input,.form select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;color:var(--ink);min-width:0;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:6px 0;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.form .chk input{width:auto;flex:none}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--ink)!important}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:var(--muted)}
.cases{display:flex;flex-direction:column;max-height:300px;overflow:auto;border-top:1px solid var(--line)}
.cases button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--soft);background:transparent;padding:7px 4px;cursor:pointer}
.cases button:hover,.cases button.on{background:var(--soft)}
.cases small{color:var(--muted);font-variant-numeric:tabular-nums}
.cases .x{color:var(--muted);padding:0 4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;color:var(--muted);border-bottom:3px solid transparent;font-family:var(--display);font-size:16px;font-weight:700}
.tabs button.on{color:var(--ink);border-bottom-color:var(--seal)}
main{min-width:0}
section.card{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px;min-width:0}
section.card h2{font-size:19px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section.card h2 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.scroll{overflow-x:auto}
table.pan{border-collapse:collapse;width:100%;min-width:520px;text-align:center;font-variant-numeric:tabular-nums}
table.pan th{font-weight:500;color:var(--muted);font-size:12px;padding:6px 4px;width:72px;text-align:left;white-space:nowrap}
table.pan td{border-left:1px solid var(--soft);padding:5px 4px;font-size:13px}
table.pan tr+tr td,table.pan tr+tr th{border-top:1px solid var(--soft)}
.gz{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.15}
.daym{position:relative}
.daym .tag{display:inline-block;font-size:11px;background:var(--seal);color:var(--sheet);border-radius:2px;padding:0 4px;margin-left:2px;vertical-align:top}
.e-木{color:var(--wood)}.e-火{color:var(--fire)}.e-土{color:var(--earth)}.e-金{color:var(--metal)}.e-水{color:var(--water)}
.bg-木{background:var(--wood)}.bg-火{background:var(--fire)}.bg-土{background:var(--earth)}.bg-金{background:var(--metal)}.bg-水{background:var(--water)}
.hid{display:flex;flex-direction:column;gap:1px;font-size:13px}
.hid i{font-style:normal;color:var(--muted);font-size:11px}
.ss{font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 6px;white-space:nowrap}
.chip.g{border-color:var(--good);color:var(--good)}.chip.b{border-color:var(--bad);color:var(--bad)}.chip.w{border-color:var(--warn);color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv div{border:1px solid var(--soft);border-radius:4px;padding:8px 10px;min-width:0}
.kv>div>span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--display);font-size:17px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:28px 1fr 64px;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.bar .t{height:14px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar b{font-family:var(--display);font-size:18px}
.gauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--water),var(--soft) 45%,var(--soft) 55%,var(--fire));margin:18px 0 6px}
.gauge i{position:absolute;top:-6px;width:4px;height:22px;background:var(--ink);border-radius:2px}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.yong{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:520px){.yong{grid-template-columns:repeat(3,minmax(0,1fr))}}
.yong div{text-align:center;border:1px solid var(--line);border-radius:4px;padding:8px 4px}
.yong span{display:block;font-size:12px;color:var(--muted)}
.yong b{font-family:var(--display);font-size:24px}
.dy{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(72px,1fr);gap:6px;overflow-x:auto;padding-bottom:6px}
.dy button{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-variant-numeric:tabular-nums}
.dy button.on{border-color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal)}
.dy button.now{background:var(--soft)}
.dy .g2{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.2;writing-mode:vertical-rl;letter-spacing:.05em}
.dy small{font-size:11px;color:var(--muted)}
.dy .sc{font-size:11px;font-weight:700}
.sc.g{color:var(--good)}.sc.b{color:var(--bad)}.sc.m{color:var(--muted)}
table.lst{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.lst th,table.lst td{border-bottom:1px solid var(--soft);padding:6px 6px;text-align:left;vertical-align:top}
table.lst th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
table.lst td.gzc{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
table.lst tr.now td{background:var(--soft)}
table.lst tr.click{cursor:pointer}
.stars{letter-spacing:1px;white-space:nowrap}
.heat{display:grid;grid-template-columns:34px repeat(31,minmax(14px,1fr));gap:2px;min-width:620px;font-size:11px;font-variant-numeric:tabular-nums}
.heat .c{aspect-ratio:1;border-radius:2px;cursor:pointer;border:0;padding:0}
.heat .h{color:var(--muted);text-align:center}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:middle;margin-right:3px}
.dayinfo{margin-top:10px;font-size:14px;min-height:24px}
.report-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grp{border:1px solid var(--soft);border-radius:4px;padding:10px 12px;min-width:0}
.grp header{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;border-bottom:1px solid var(--soft);padding-bottom:6px}
.grp header b{font-family:var(--display)}
.grp header button{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12px;padding:0 4px}
.grp label{display:flex;gap:6px;font-size:13px;align-items:flex-start;padding:2px 0;cursor:pointer}
.grp label input{margin-top:5px}
.book{max-width:72ch}
.book h3{font-size:18px;margin:26px 0 8px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.book h3 em{font-style:normal;font-family:var(--body);font-size:12px;color:var(--seal);letter-spacing:.1em}
.book h4{font-family:var(--display);font-size:16px;margin:16px 0 4px}
.book p{margin:6px 0}
.book ul{margin:6px 0;padding-left:1.3em}
.book .lead{font-size:16px}
.book table{margin:8px 0}
.svgbox svg{width:100%;height:auto;display:block}
.svgbox text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:4px;font-size:14px;z-index:9}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px}
.kv.ten{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.kv.ten b{font-family:var(--body);font-variant-numeric:tabular-nums}
.he-top{display:grid;grid-template-columns:minmax(0,1fr) 140px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:760px){.he-top{grid-template-columns:minmax(0,1fr)}}
.mini{min-width:0}
.mini-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.mini-h b{font-family:var(--display);font-size:18px}
.mini-p{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;border:1px solid var(--soft);border-radius:4px;padding:6px 0}
.mini-p small{display:block;font-size:11px;color:var(--muted)}
.mini-p .g3{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.15}
.he-score{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-inline:1px solid var(--soft)}
.he-score b{font-family:var(--display);font-size:56px;line-height:1;color:var(--seal);font-variant-numeric:tabular-nums}
@media (max-width:760px){.he-score{border-inline:0;border-block:1px solid var(--soft)}}
.he-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.he-it{min-width:0}
.he-row{display:flex;justify-content:space-between;gap:8px}
.he-row .tab{font-variant-numeric:tabular-nums;color:var(--muted)}
.he-it .t{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 6px}
.he-it .t i{display:block;height:100%}
.he-it p{margin:0;font-size:14px}
@media (prefers-reduced-motion:no-preference){.gz{transition:color .2s}}
</style>
</head>
<body>

<header class="top">
  <h1>正統八字<span>論命</span></h1>
  <span class="sub">四柱．十神．五行旺衰．喜用神．大運流年流月流日．命書產製</span>
  <div class="who" id="who"></div>
</header>

<div class="wrap">
  <aside class="side">
    <div class="panel">
      <span class="lbl">問測者基本資料</span>
      <form class="form" id="f">
        <label class="full">姓名<input id="fName" required maxlength="20" placeholder="例：王小明"></label>
        <div class="fl"><span>性別</span><div class="seg" id="fSex" role="group" aria-label="性別"><button type="button" data-v="1" class="on">乾造（男）</button><button type="button" data-v="0">坤造（女）</button></div></div>
        <div class="fl"><span>曆法</span><div class="seg" id="fCal" role="group" aria-label="曆法"><button type="button" data-v="s" class="on">國曆</button><button type="button" data-v="l">農曆</button></div></div>
        <label>年<input id="fY" type="number" min="1900" max="2100" required></label>
        <label>月<select id="fM"></select></label>
        <label>日<select id="fD"></select></label>
        <label>時:分<input id="fT" type="time" required></label>
        <label class="chk full" id="leapBox" hidden><input type="checkbox" id="fLeap">閏月</label>
        <label class="full">出生地（真太陽時校正）<select id="fPlace"></select></label>
        <label class="full" id="lngBox" hidden>自訂經度（東經）<input id="fLng" type="number" step="0.01" value="120.5"></label>
        <label class="chk full"><input type="checkbox" id="fTST" checked>使用真太陽時排盤</label>
        <label class="chk full"><input type="checkbox" id="fDST">出生時實施夏令（日光節約）時間，扣回 1 小時</label>
        <label class="full">子時派別<select id="fZi"><option value="2">晚子時（23 時後日柱仍算當日）</option><option value="1">子正換日（23 時起算次日）</option></select></label>
        <label class="full">論命日期<input id="fNow" type="date"></label>
        <div class="row full"><button class="btn" type="submit">排盤論命</button><button class="btn ghost" type="button" id="saveBtn">存入案卷</button></div>
      </form>
    </div>
    <div class="panel">
      <span class="lbl">案卷（存於此瀏覽器）</span>
      <input id="search" placeholder="搜尋姓名" style="width:100%;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;margin-bottom:8px">
      <div class="cases" id="cases"></div>
      <p class="note">標示「範例」者為示範案例。案卷只存在你這台裝置的瀏覽器中。</p>
    </div>
  </aside>
  <main>
    <nav class="tabs" id="tabs">
      <button data-t="pan" class="on">八字命盤</button>
      <button data-t="wx">五行喜忌</button>
      <button data-t="yun">大運流年</button>
      <button data-t="day">流月流日</button>
      <button data-t="he">八字合婚</button>
      <button data-t="book">命書產製</button>
    </nav>
    <div id="view"></div>
  </main>
</div>
<footer style="max-width:1320px;margin:24px auto 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)">本工具依傳統八字命理規則推算，結果僅供參考，不構成醫療、法律或投資建議。案卷資料只存在你自己的瀏覽器中，不會上傳。</footer>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.3/lunar.js"></script>
<script>
// ================= 基礎資料 =================
const GAN='甲乙丙丁戊己庚辛壬癸'.split('');
const ZHI='子丑寅卯辰巳午未申酉戌亥'.split('');
const WX=['木','火','土','金','水'];
const GAN_WX=i=>WX[Math.floor(i/2)];
const ZHI_WX_ARR=['水','土','木','木','土','火','火','土','金','金','土','水'];
const SX='鼠牛虎兔龍蛇馬羊猴雞狗豬'.split('');
const HIDE={子:['癸'],丑:['己','癸','辛'],寅:['甲','丙','戊'],卯:['乙'],辰:['戊','乙','癸'],巳:['丙','戊','庚'],午:['丁','己'],未:['己','丁','乙'],申:['庚','壬','戊'],酉:['辛'],戌:['戊','辛','丁'],亥:['壬','甲']};
const HIDE_W=[1,0.5,0.3];
const NAYIN='海中金,爐中火,大林木,路旁土,劍鋒金,山頭火,澗下水,城頭土,白蠟金,楊柳木,泉中水,屋上土,霹靂火,松柏木,長流水,砂中金,山下火,平地木,壁上土,金箔金,覆燈火,天河水,大驛土,釵釧金,桑柘木,大溪水,沙中土,天上火,石榴木,大海水'.split(',');
const CS='長生,沐浴,冠帶,臨官,帝旺,衰,病,死,墓,絕,胎,養'.split(',');
const CS_START={甲:'亥',乙:'午',丙:'寅',丁:'酉',戊:'寅',己:'酉',庚:'巳',辛:'子',壬:'申',癸:'卯'};
const S2T={'杀':'殺','种':'種','满':'滿','处':'處','惊':'驚','蛰':'蟄','谷':'穀','鸡':'雞','龙':'龍','马':'馬','猪':'豬','闰':'閏','腊':'臘','冬':'冬','寒':'寒','小':'小','大':'大'};
const t2=s=>String(s).split('').map(c=>S2T[c]||c).join('');
const gi=g=>GAN.indexOf(g), zi=z=>ZHI.indexOf(z);
const idx60=(g,z)=>(gi(g)*6-zi(z)*5+60)%60;
const nayin=gz=>NAYIN[Math.floor(idx60(gz[0],gz[1])/2)];
const zwx=z=>ZHI_WX_ARR[zi(z)];
const wxOf=c=>GAN.includes(c)?GAN_WX(gi(c)):zwx(c);
const wxi=w=>WX.indexOf(w);
const SHENG=w=>WX[(wxi(w)+1)%5], KE=w=>WX[(wxi(w)+2)%5], BEISHENG=w=>WX[(wxi(w)+4)%5], BEIKE=w=>WX[(wxi(w)+3)%5];

function shishen(dg,og){ // 日干對他干之十神
  const a=gi(dg),b=gi(og);const d=(Math.floor(b/2)-Math.floor(a/2)+5)%5;const same=(a%2)===(b%2);

    rank={yong:rank[0],xi:rank[1],xian:rank[2],ji:G.印星,chou:dw};
    if(score[G.印星]<score[dw]){rank.ji=dw;rank.chou=G.印星;}
  }else{
    const useYin=score[G.官殺]>=score[G.食傷]; // 官殺重用印化，食傷重用印制
    rank={yong:useYin||score[G.財星]<score[G.食傷]?G.印星:dw,xi:null,ji:null,chou:null,xian:null};
    rank.xi=rank.yong===G.印星?dw:G.印星;
    const bad=[G.官殺,G.財星,G.食傷].sort((a,b)=>score[b]-score[a]);rank.ji=bad[0];rank.chou=bad[1];rank.xian=bad[2];
    if(ratio<0.22){rank.yong=dw;rank.xi=G.印星;}
  }
  // 調候
  let tiaohou=null;const mzi=P[1].z;
  if('巳午未'.includes(mzi)&&pct.水<0.12)tiaohou='水';if('亥子丑'.includes(mzi)&&pct.火<0.12)tiaohou='火';
  const yun=ec.getYun(inp.sex,2);
  const dayun=yun.getDaYun(10).slice(1).map(d=>({gz:d.getGanZhi(),sy:d.getStartYear(),ey:d.getEndYear(),sa:d.getStartAge(),ea:d.getEndAge(),obj:d}));
  return {inp,solar:s2,clock,lunar,ec,P,dg,dw,score,pct,ratio,strength,rank,tiaohou,notes,
    qiyun:{y:yun.getStartYear(),m:yun.getStartMonth(),d:yun.getStartDay(),solar:yun.getStartSolar()},dayun,
    mingGong:ec.getMingGong(),taiYuan:ec.getTaiYuan(),shenGong:ec.getShenGong(),
    shengxiao:SX[zi(P[0].z)],prevJie:lunar.getPrevJie(),nextJie:lunar.getNextJie()};
}

function wxWeight(C,w){const r=C.rank;let v=0;if(w===r.yong)v=1;else if(w===r.xi)v=0.6;else if(w===r.ji)v=-1;else if(w===r.chou)v=-0.6;else v=0.1;if(C.tiaohou===w)v+=0.4;return v;}
function scoreGZ(C,gz){
  const g=gz[0],z=gz[1];let s=wxWeight(C,GAN_WX(gi(g)))*0.45+wxWeight(C,zwx(z))*0.55;
  const dz=C.P[2].z;if(isChong(z,dz))s-=0.35;if(pairIn(LIUHE,z,dz))s+=0.15;if(isXing(z,dz))s-=0.15;
  if(isGanChong(g,C.dg))s-=0.15;
  return Math.max(-1,Math.min(1,s));
}
const toStar=s=>Math.max(1,Math.min(5,Math.round((s+1)*2+1)));
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const verdict=s=>s>=0.45?['大吉','g']:s>=0.15?['吉','g']:s>-0.15?['平','m']:s>-0.45?['小凶','b']:['凶','b'];
// 財運：財星與喜用
function wealthScore(C,gz){const fw=KE(C.dw);let s=scoreGZ(C,gz);const gss=shishen(C.dg,gz[0]);const zss=shishen(C.dg,HIDE[gz[1]][0]);
  if(SS_GROUP[gss]==='財星'||SS_GROUP[zss]==='財星')s+=wxWeight(C,fw)>0?0.3:(C.ratio>=0.46?0.2:-0.2);
  if((gss==='劫財'||zss==='劫財')&&C.rank.ji===C.dw)s-=0.3;
  if(SS_GROUP[gss]==='食傷'&&C.ratio>=0.46)s+=0.1;
  return Math.max(-1,Math.min(1,s));}

  return ul(out.length?out:['命局結構分散，宜先累積專業，再依大運擇定方向'])+`<p>${(gStr('官殺')+gStr('印星'))>0.35&&C.ratio>=0.4?'官印有力，可往高階主管發展。':'以專業取勝，位階以中階主管、專家顧問最能發揮。'}</p>`;};
const _f14=SEC.f14;SEC.f14=()=>{const strong=C.ratio>=0.46;return _f14()+'<h4>發財與破財時機</h4>'+ul(strong?['身強：走財星、官殺、食傷運時較易發財','走比劫、印星運時容易破財或錢財停滯，宜保守']:['身弱：走印星、比劫運時較易發財，可與朋友合作','走財星運時反而容易因財受累，投資宜保守'])+'<h4>喜用神的位置</h4>'+ul(C.P.map((p,i)=>[GAN_WX(gi(p.g)),i]).filter(([w])=>[C.rank.yong,C.rank.xi].includes(w)).map(([w,i])=>`${['年柱','月柱','日柱','時柱'][i]}見喜用（${w}）：${['早年得家庭資助','青年即有理財機會、得父母兄弟之力','靠自己努力累積財富','晚年財源穩定、子女有助'][i]}`))};
// 流年分頁：點選年份時補上詳解
const _vd2=viewDay;viewDay=function(){const Y=dayYear;const gz=Solar.fromYmd(Y,6,1).getLunar().getYearInGanZhiExact();const h=_vd2();const k=h.indexOf('</section>')+10;
  return h.slice(0,k)+`<section class="card"><h2>${Y} 流年詳解 <small>天干主上半年、地支主下半年</small></h2>${gzDetail(C,gz)}</section>`+h.slice(k);};
// 啟動
TAB=LS.get('bazi.tab','pan');[...$('#tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.t===TAB));
if(!cases.length)cases=SAMPLES.slice();curId=cases[0].id;writeForm(cases[0]);renderCases();run(cases[0]);
